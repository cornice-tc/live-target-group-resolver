[project]
name = "live-target-group-resolver"
version = "1.0.0"
requires-python = ">=3.12"
license = "Apache-2.0"
# boto3 and urllib3 ship in the Lambda runtime.
dependencies = []

[dependency-groups]
dev = [
    "bandit==1.9.4",
    "mypy==2.4.0",
    "pre-commit==4.7.0",
    "ruff==0.17.2",
]
test = [
    "pytest==9.1.1",
    "boto3==1.43.121",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
# Vendored AWS code, left unmodified.
exclude = ["cfnresponse.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
exclude = ["cfnresponse.py"]
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true
warn_unused_ignores = false
warn_return_any = true
warn_redundant_casts = true
no_implicit_optional = true
